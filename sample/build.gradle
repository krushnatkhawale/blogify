plugins {
    id 'java'
    id 'io.github.krushnatkhawale.blogify' version '0.1.0'
}

blogify {
    siteTitle = 'Blogify'
    repoUrl = 'https://github.com/krushnatkhawale/blogify'
    theme = 'primer'
    blogHome = 'https://krushnatkhawale.github.io/#/blogs'
    googleAnalyticsId = 'G-5BJKLL1EXD'
    enableVisitorCounter = true
}



