name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Gradle Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test Plugin
        run: ./gradlew build --no-daemon

      - name: Publish Plugin to Local Maven
        run: ./gradlew :core:publishToMavenLocal :gradle-plugin:publishToMavenLocal --no-daemon

      - name: Test Sample Blog Generation
        run: ./gradlew :sample:generateBlog --no-daemon
