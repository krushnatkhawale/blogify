name: Publish Plugin to Gradle Plugin Portal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (optional override, e.g. 0.2.0)'
        required: false
        default: ''

jobs:
  publish:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish Plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ./gradlew :gradle-plugin:publishPlugins -Pversion="${{ github.event.inputs.version }}" --no-daemon
          else
            ./gradlew :gradle-plugin:publishPlugins --no-daemon
          fi
