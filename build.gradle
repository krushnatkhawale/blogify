plugins {
    id 'base'
    id 'maven-publish'
    id 'signing'
}

allprojects {
    group = 'io.github.krushnatkhawale.blogify'
    version = '0.1.0'

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        if (options instanceof StandardJavadocDocletOptions) {
            ((StandardJavadocDocletOptions) options).addStringOption('Xdoclint:none', '-quiet')
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            showStandardStreams = true
        }
    }

    // Configure publishing and signing only for distributable libraries (:core and :gradle-plugin)
    if (project.name != 'sample') {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        // :core publication (for maven publication / central)
        if (project.name == 'core') {
            publishing {
                publications {
                    mavenJava(MavenPublication) {
                        from components.java
                        pom {
                            name = 'Blogify Core'
                            description = 'Blogify: Core static blog generator engine and markdown parsers'
                            url = 'https://github.com/krushnatkhawale/blogify'
                            licenses {
                                license {
                                    name = 'The Apache License, Version 2.0'
                                    url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                                }
                            }
                            developers {
                                developer {
                                    id = 'krushnatkhawale'
                                    name = 'Krushnat Khawale'
                                }
                            }
                            scm {
                                connection = 'scm:git:git://github.com/krushnatkhawale/blogify.git'
                                developerConnection = 'scm:git:ssh://github.com:krushnatkhawale/blogify.git'
                                url = 'https://github.com/krushnatkhawale/blogify'
                            }
                        }
                    }
                }
            }
        }

        signing {
            required { gradle.taskGraph.hasTask('publish') && !version.endsWith('-SNAPSHOT') }
            def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
            def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
            if (signingKey && signingPassword) {
                useInMemoryPgpKeys(signingKey, signingPassword)
                sign publishing.publications
            }
        }
    }
}

tasks.register('createReleaseTag') {
    group = 'release'
    description = 'On-demand task to create and optionally push an annotated Git release tag (e.g. v0.1.0).'

    doLast {
        def tagName = project.findProperty('tag') ?: "v${project.version}"
        def pushTag = project.hasProperty('push') || project.findProperty('pushTag') == 'true'

        def runGit = { List<String> args ->
            def fullCmd = ['git']
            for (String arg : args) {
                fullCmd.add(arg.toString())
            }
            def proc = fullCmd.execute((String[]) null, project.rootDir)
            def out = proc.inputStream.text.trim()
            def err = proc.errorStream.text.trim()
            proc.waitFor()
            if (proc.exitValue() != 0 && err) {
                throw new GradleException("Git error: ${err}")
            }
            return out
        }

        def checkTag = runGit(['tag', '-l', tagName])

        if (checkTag == tagName) {
            println "⚡ Git tag '${tagName}' already exists locally."
        } else {
            runGit(['tag', '-a', tagName, '-m', "Release ${tagName}"])
            println "✅ Created annotated Git release tag '${tagName}' locally."
        }

        if (pushTag) {
            runGit(['push', 'origin', tagName])
            println "🚀 Pushed tag '${tagName}' to origin."
        } else {
            println "ℹ️ To push this tag to remote, pass -Ppush (or run: git push origin ${tagName})."
        }
    }
}
