plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '1.3.1'
}

// Support reading Gradle Plugin Portal credentials directly from environment variables
def publishKey = System.getenv('GRADLE_PUBLISH_KEY') ?: findProperty('gradle.publish.key')
def publishSecret = System.getenv('GRADLE_PUBLISH_SECRET') ?: findProperty('gradle.publish.secret')
if (publishKey && !System.getProperty('gradle.publish.key')) {
    System.setProperty('gradle.publish.key', publishKey.toString())
}
if (publishSecret && !System.getProperty('gradle.publish.secret')) {
    System.setProperty('gradle.publish.secret', publishSecret.toString())
}

sourceSets {
    main {
        java {
            srcDir project(':core').file('src/main/java')
        }
    }
}

dependencies {
    implementation 'com.github.javaparser:javaparser-core:3.26.2'

    testImplementation gradleTestKit()
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    website = 'https://github.com/krushnatkhawale/blogify'
    vcsUrl = 'https://github.com/krushnatkhawale/blogify.git'
    plugins {
        blogify {
            id = 'io.github.krushnatkhawale.blogify'
            displayName = 'Blogify Gradle Plugin'
            description = 'Story-first static engineering blog generator from source code and Markdown bundles with on-demand GitHub Pages deployment'
            tags.set(['blog', 'documentation', 'markdown', 'github-pages', 'static-site'])
            implementationClass = 'io.github.krushnatkhawale.blogify.gradle.BlogifyPlugin'
        }
    }
}
